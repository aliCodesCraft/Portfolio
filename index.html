<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheikh Ali | Portfolio</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-size: 5em;
      background-image: url(img/bg.jpg);
      background-position: center center;
      overflow: hidden;
    }

    .banner {
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('img/valentin-petrov-m-mal-01.jpg');
      background-size: cover;
      background-position: center;
      animation: bgZoomOut 3s ease-in-out 1 forwards;
      z-index: -1;
      pointer-events: none;
    }


    @media screen and (max-width:600px) {
      .banner {
        background-image: url('img/1bg2.png') !important;
        background-size: cover;
        background-position: center center;
      }
    }

    @keyframes bgZoomIn {
      from {
        transform: scale(1.2);
      }

      to {
        transform: scale(4);
      }
    }

    @keyframes bgZoomOut {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.1);
      }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Soft black overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.11);
      /* light black tint */
      pointer-events: none;
    }


    /* --- container for character to provide perspective --- */
    .char-stage {
      position: fixed;
      left: 48%;
      bottom: -370px;
      transform: translateX(-50%);
      width: var(--char-width);
      height: auto;
      z-index: 5;
      /* above overlay */
      display: flex;
      align-items: flex-end;
      justify-content: center;
      perspective: 1200px;
      /* gives 3D depth */
      pointer-events: none;
      /* clicks pass through unless you change */
    }

    /* wrapper to apply 3d transforms and smoother animations */
    .char-wrap {
      transform-style: preserve-3d;
      will-change: transform, filter;
      /* filter: drop-shadow(0 18px 30px rgba(0,0,0,0.6)); */
    }

    /* the image itself */
    .char {
      width: 800px;
      height: auto;
      display: block;
      transform-origin: 50% 85%;
      /* pivot near feet for nicer tilt */
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform, opacity;
      /* slight soft glow to separate from background */
      filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 8px rgba(255, 255, 255, 0.03));
      /* animation: bgZoomOut 4s ease-in-out 1 forwards; */
      animation: bgZoomIn 3s ease-in-out 1 forwards;
    }


    @keyframes rise {
      0% {
        transform: translate3d(0, 40vh, 0) rotateX(0deg) rotateY(0deg) translateZ(0);
        opacity: 0;
      }

      40% {
        opacity: 1;
      }

      60% {
        transform: translate3d(0, 6vh, 0) rotateX(3deg) rotateY(-4deg) translateZ(20px);
        opacity: 1;
      }

      100% {
        transform: translate3d(0, 8vh, 0) rotateX(4deg) rotateY(-6deg) translateZ(30px);
        opacity: 1;
      }
    }

    @keyframes bob {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-var(--bob-distance));
      }

      100% {
        transform: translateY(0);
      }
    }

    @keyframes tilt {
      0% {
        transform: rotateY(-6deg) rotateX(4deg);
      }

      50% {
        transform: rotateY(6deg) rotateX(2deg);
      }

      100% {
        transform: rotateY(-6deg) rotateX(4deg);
      }
    }



    /* responsive smaller size on narrow screens */
    @media (max-width:520px) {
      :root {
        --char-width: 220px;
        --bob-distance: 8px;
      }
    }

    @keyframes bgZoomIn {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.6);
      }
    }

    /* Scroll Indicator Base */
    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      /* adjust based on your banner */
      left: 45%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      z-index: 100;
    }

    /* Mouse Shape */
    .mouse {
      width: 30px;
      height: 50px;
      border: 2px solid #fff;
      border-radius: 25px;
      position: relative;
      margin: 0 auto 10px auto;
      box-sizing: border-box;
    }

    /* Ball inside Mouse */
    .wheel {
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      animation: scroll 1.5s infinite;
    }

    /* Animation Keyframes */
    @keyframes scroll {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px);
      }

      40% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, 0);
      }
    }

    /* Text styling */
    .scroll-indicator span {
      letter-spacing: 1px;
      opacity: 0.8;
    }


    /* Initially hidden and down */
.title,
.scroll-indicator {
  opacity: 0;
  transform: translateY(50px);
  transition: all 0.8s ease-out;
}

/* Slide up trigger */
.title.slide-up,
.scroll-indicator.slide-up {
  opacity: 1;
  transform: translateY(0);
}

.title.slide-up{
  mix-blend-mode: overlay;
  opacity: 0.7;



}

  </style>
</head>

<body>
  <div class="banner">
    <div class="title">
      <img src="img/title.png"" style=" width:750px; mix-blend-mode: overlay; opacity: 0.7;">
    </div>
  </div>

  <canvas id="stars"></canvas>
  <div class="overlay"></div>

  <div class="char-stage" aria-hidden="true">
    <div class="char-wrap">
      <img class="char" src="img/char.png" alt="Character" />
    </div>
  </div>

  <div class="scroll-indicator">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
    <span>Scroll Down</span>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');

    let w, h, particles = [];
    const num = 60; // stars count

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // create stars
    for (let i = 0; i < num; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 2 + 0.3,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.3,
      });
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'white';
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'white';

      for (let p of particles) {
        p.x += p.speedX;
        p.y += p.speedY;

        // wrap edges
        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>

  <script>
  window.addEventListener("DOMContentLoaded", () => {
    // Wait 3s (same as char zoom animation duration)
    setTimeout(() => {
      document.querySelector('.title').classList.add('slide-up');
      document.querySelector('.scroll-indicator').classList.add('slide-up');
    }, 2400);
  });
</script>

</body>

</html>
